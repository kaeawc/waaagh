name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: ShellCheck
        run: shellcheck -S warning -x skills/orchestrate/scripts/*.sh bin/*.sh
      - name: Hostile git config (the suites must not depend on it)
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.program false
      - name: Self-test (every suite)
        run: bats skills/orchestrate/scripts/*.bats
      - name: Validate manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json >/dev/null
