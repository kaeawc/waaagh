name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; pushes to main always run to the end.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bats from its pinned release (commit checked), instead of apt-get update + install.
      - name: Install bats
        run: |
          git clone -q --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          test "$(git -C "$RUNNER_TEMP/bats" rev-parse HEAD)" = 3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87
          sudo "$RUNNER_TEMP/bats/install.sh" /usr/local >/dev/null
          bats --version
      # spectra (#329) from its pinned release (checksum checked). It stays off PATH: the suites stub
      # it and never read the real host. This proves the release meets orch_spectra_require for
      # every capability the scripts use, minimum version included.
      - name: Install and check spectra
        env:
          SPECTRA_VERSION: v0.1.2
        run: |
          d="$RUNNER_TEMP/spectra" && mkdir -p "$d" && cd "$d"
          base="https://github.com/kaeawc/spectra/releases/download/$SPECTRA_VERSION"
          tgz="spectra_${SPECTRA_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tgz" -O "$base/checksums.txt"
          grep -F "  $tgz" checksums.txt | sha256sum -c -
          tar xzf "$tgz"
          bin="$d/spectra_${SPECTRA_VERSION}_linux_amd64/bin"
          "$bin/spectra" version
          test -x "$bin/spectra-mcp"
          cd "$GITHUB_WORKSPACE"
          # The capabilities named by orch_spectra_require calls in code, not in comments.
          caps=$(grep -hoE '^[^#]*orch_spectra_require( [a-z]+)+' skills/orchestrate/scripts/*.sh |
            grep -oE 'orch_spectra_require( [a-z]+)+' | sed 's/^orch_spectra_require //' | tr ' ' '\n' | sort -u | tr '\n' ' ')
          test -n "$caps"
          echo "capabilities: $caps"
          # shellcheck disable=SC2086 # one word per capability
          SPECTRA="$bin/spectra" bash -c 'source skills/orchestrate/scripts/_lib.sh && orch_spectra_require "$@"' _ $caps
          echo "SPECTRA_BIN=$bin/spectra" >>"$GITHUB_ENV"
      # Every spectra JSON field the scripts read (skills/orchestrate/spectra-contract.tsv, #370), run
      # against the release above: a field spectra renames or drops fails here. Read-only commands
      # under a scratch directory in the checkout (one idle process and a JVM, stopped on exit).
      - name: Check the spectra JSON contract
        run: dev/spectra-contract.sh --spectra "$SPECTRA_BIN" --root "$GITHUB_WORKSPACE"
      - name: ShellCheck
        run: shellcheck -S warning -x skills/orchestrate/scripts/*.sh skills/orchestrate/scripts/gh-shim/gh dev/*.sh
      - name: Validate manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json >/dev/null
      - name: Hostile git config (the suites must not depend on it)
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.program false
      # With bashcov's exported SHELLOPTS (errexit, nounset, pipefail; no xtrace), so a test that
      # fails only under the main-branch Coverage job fails here, before merge (#152, #153). Measured
      # at about the plain run's wall time (+6%), so it replaces the plain run instead of adding a job.
      - name: Self-test (every suite, in parallel, with bashcov's SHELLOPTS)
        run: dev/test.sh -j "$(nproc)" --bashcov-shellopts
