name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: ShellCheck
        run: |
          cd skills/orchestrate/scripts && shellcheck -x ./*.sh
          shellcheck ../../../bin/codex-lane-run.sh
      - name: Self-test
        run: bats skills/orchestrate/scripts/selftest.bats
      - name: Validate manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json >/dev/null
