name: Coverage

# Line coverage of the scripts (dev/coverage.sh, bashcov). It fails when a script drops below its
# floor in dev/coverage-floor.tsv or a script has no row there. It runs on pushes to main, by hand,
# and on pull requests that change a script, a suite, dev/ or this workflow (#157): the floors sit 1
# point under each script's credited coverage, so a PR that adds an untested branch would otherwise
# pass PR CI and turn this job red on main for every later commit. It is its own workflow, so the
# fast `scripts` check in test.yml does not wait for it.
#
# One run of every suite under bashcov passed 30 minutes at about 940 tests (#287), and bashcov
# cannot run suites in parallel on one runner (#194). So the suites are split into shards (#295):
# each `shard` job runs bashcov at -j 1 on its share (dev/coverage.sh --shard K/N, balanced by
# dev/coverage-weights.tsv; a new suite lands in some shard by itself) and uploads its resultset.
# The `coverage` job (the check name branch protection knows) merges them, prints the table and
# judges the floors on the merged numbers. To add a shard, add it to the matrix and raise N in the
# --shard line together.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'skills/orchestrate/scripts/**'
      - 'bin/**'
      - 'dev/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a coverage run still in flight on the same ref: main, or one PR's merge ref.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # bats from its pinned release (commit checked), as in test.yml.
      - name: Install bats
        run: |
          git clone -q --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          test "$(git -C "$RUNNER_TEMP/bats" rev-parse HEAD)" = 3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87
          sudo "$RUNNER_TEMP/bats/install.sh" /usr/local >/dev/null
          bats --version
      # The runner's preinstalled Ruby; bashcov pulls in simplecov.
      - name: Install bashcov
        run: |
          gem install --user-install --no-document bashcov -v 4.0.2
          echo "$(ruby -e 'print Gem.user_dir')/bin" >>"$GITHUB_PATH"
      - name: Hostile git config (the suites must not depend on it)
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.program false
      - name: Coverage (this shard's suites under bashcov)
        run: dev/coverage.sh --shard ${{ matrix.shard }}/4
      # The resultset, subset.txt and test.log, for the merge (and test.log for --weights).
      - name: Upload shard coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  coverage:
    needs: shard
    # Merge whatever the shards wrote even when one failed, so the table still prints; the last step
    # fails this check whenever a shard did not succeed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # One directory per shard: shards/coverage-shard-K/.resultset.json.
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: shards
      - name: Merge the shards
        run: dev/coverage.sh --merge shards/*
      - name: Coverage floors
        if: ${{ !cancelled() && hashFiles('coverage/.resultset.json') != '' }}
        run: dev/coverage.sh --check dev/coverage-floor.tsv
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Every shard succeeded
        if: ${{ !cancelled() && needs.shard.result != 'success' }}
        run: |
          echo "a coverage shard did not succeed (${{ needs.shard.result }}): see its job log" >&2
          exit 1
